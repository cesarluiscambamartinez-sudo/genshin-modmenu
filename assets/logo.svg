<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#4fd1c5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e1420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c14e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" fill="#0e1420"/>

  <!-- off-center arcane halo -->
  <circle cx="118" cy="132" r="92" fill="url(#g1)"/>
  <circle cx="118" cy="132" r="90" fill="none" stroke="#4fd1c5" stroke-width="0.8" opacity="0.35"/>
  <circle cx="118" cy="132" r="82" fill="none" stroke="#4fd1c5" stroke-width="0.5" opacity="0.2" stroke-dasharray="2 5"/>

  <!-- wrench handle: diagonal from lower-left toward gem -->
  <g>
    <path d="M42 214 L88 168" stroke="#e8e2d0" stroke-width="11" stroke-linecap="round"/>
    <path d="M42 214 L88 168" stroke="#0e1420" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 206 L82 174" stroke="#4fd1c5" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- wrench open jaw at lower left -->
  <path d="M30 226 L44 212 L58 226 L44 240 Z" fill="#e8e2d0"/>
  <path d="M36 220 L44 228 L52 220" fill="none" stroke="#0e1420" stroke-width="3" stroke-linejoin="round"/>

  <!-- slider track: vertical right side -->
  <rect x="188" y="52" width="10" height="140" rx="5" fill="#0e1420" stroke="#e8e2d0" stroke-width="2"/>
  <line x1="193" y1="60" x2="193" y2="184" stroke="#4fd1c5" stroke-width="1" opacity="0.4" stroke-dasharray="3 4"/>

  <!-- slider knobs -->
  <rect x="182" y="78" width="22" height="10" rx="3" fill="#f2c14e"/>
  <rect x="182" y="78" width="22" height="10" rx="3" fill="none" stroke="#0e1420" stroke-width="1"/>
  <rect x="182" y="132" width="22" height="10" rx="3" fill="#4fd1c5"/>
  <rect x="182" y="132" width="22" height="10" rx="3" fill="none" stroke="#0e1420" stroke-width="1"/>
  <circle cx="193" cy="154" r="4" fill="#e8e2d0"/>

  <!-- central Vision gemstone (faceted diamond) -->
  <g transform="translate(118 128)">
    <polygon points="0,-40 30,-14 24,26 0,42 -24,26 -30,-14" fill="#4fd1c5" opacity="0.18"/>
    <polygon points="0,-40 30,-14 24,26 0,42 -24,26 -30,-14" fill="none" stroke="#4fd1c5" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="0,-40 14,-14 0,42 -14,-14" fill="#4fd1c5" opacity="0.55"/>
    <polygon points="0,-40 30,-14 0,-14" fill="#e8e2d0" opacity="0.9"/>
    <polygon points="0,-40 -30,-14 0,-14" fill="#e8e2d0" opacity="0.7"/>
    <polygon points="30,-14 24,26 0,-14" fill="#f2c14e" opacity="0.55"/>
    <polygon points="-30,-14 -24,26 0,-14" fill="#4fd1c5" opacity="0.75"/>
    <polygon points="24,26 0,42 0,-14" fill="#e8e2d0" opacity="0.35"/>
    <polygon points="-24,26 0,42 0,-14" fill="#f2c14e" opacity="0.35"/>
    <!-- inner glow line -->
    <polyline points="-8,-30 0,-8 8,-30" fill="none" stroke="#e8e2d0" stroke-width="1.4" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="0" cy="-2" r="3" fill="#e8e2d0"/>
  </g>

  <!-- gem outer glow ring -->
  <circle cx="118" cy="128" r="46" fill="none" stroke="#4fd1c5" stroke-width="0.7" opacity="0.6" stroke-dasharray="4 6"/>
  <circle cx="118" cy="128" r="52" fill="none" stroke="#f2c14e" stroke-width="0.5" opacity="0.3" stroke-dasharray="1 7"/>

  <!-- small arcane sparkles (mischief) -->
  <g fill="#f2c14e">
    <polygon points="76,84 79,91 86,94 79,97 76,104 73,97 66,94 73,91"/>
    <polygon points="158,64 160,69 165,71 160,73 158,78 156,73 151,71 156,69" opacity="0.85"/>
    <polygon points="66,152 68,156 72,158 68,160 66,164 64,160 60,158 64,156" opacity="0.7"/>
  </g>

  <!-- tiny terminal cursor marks -->
  <rect x="60" y="196" width="10" height="3" fill="#4fd1c5" opacity="0.9"/>
  <rect x="74" y="196" width="16" height="3" fill="#4fd1c5" opacity="0.5"/>
  <rect x="94" y="196" width="5" height="3" fill="#4fd1c5" opacity="0.3"/>

  <!-- wordmark, small, bottom-right -->
  <text x="212" y="234" font-family="monospace" font-size="9" fill="#e8e2d0" text-anchor="end" opacity="0.55">genshin-modmenu</text>
</svg>
